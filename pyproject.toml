[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-dsl"
version = "0.1.0"
description = "Declarative, validated trading-strategy DSL contracts"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
trading-dsl-validate = "trading_dsl.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
trading_dsl = ["schemas/*.json", "config/*.toml"]

[tool.setuptools.packages.find]
where = ["src"]
